[package]
name = "orc-pen-solver"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solidcraft-sketch = { path = "../upstream/crates/sketch" }
solidcraft-geom = { path = "../upstream/crates/geom" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
panic = "abort"
